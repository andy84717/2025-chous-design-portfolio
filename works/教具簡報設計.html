    <h2>給特殊教育的學生，一場生動的教學體驗</h2>
    <p class="project-meta">簡報設計・2020年</p>

    <div class="project-description">
      <p>
        案主是一位特教班的老師，由於學生們注意力比較不容易集中，因此想盡各種方式，來達到教學的目的。
      </p>
      <p>
        跟案主討論過後，決定用「色彩」與「互動」來達成目的。藉由多元的色彩、吸引學生的目光，再利用簡報的一些互動特性，讓案主可以順利在一些簡報展示時的時機點，進行拉回學生注意力的動作。
      </p>
      <p>本專案設計，共計39頁。</p>
