  <style>
    hr {
      width:80%;
    }
    .contact-section {
      max-width: 600px;
      margin: 60px auto;
      padding: 0 20px;
    }

    .contact-section h2 {
      font-family: "Cactus Classical Serif", serif;
      font-size: 2rem;
      margin-bottom: 20px;
      text-align: center;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 40px;
    }

    label {
      font-weight: bold;
    }

    input,
    textarea {
      padding: 12px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-family: "Noto Sans TC", sans-serif;
      width: calc(100% - 24px);
      /* 讓 input 寬度填滿，並扣除 padding */
      box-sizing: border-box;
      /* 讓 padding 不會增加總寬度 */
    }

    textarea {
      resize: vertical;
      /* 允許垂直拖動調整大小，但限制水平 */
    }

    .contact-section button {
      padding: 12px;
      font-size: 1rem;
      border: none;
      border-radius: 40px;
      background-color: #111;
      color: white;
      cursor: pointer;
      transition: background-color 0.3s;
      width: 100%;
      /* 讓按鈕在小螢幕上可以填滿 */
      max-width: 200px;
      /* 控制按鈕最大寬度，避免過長 */
      margin: 0 auto;
      /* 置中按鈕 */
    }

    .contact-section button:hover {
      background-color: #444;
    }

    .social-media-links {
      display: flex;
      /* 使用 flexbox 排列社群圖示 */
      justify-content: center;
      /* 水平置中 */
      gap: 20px;
      /* 圖示間距 */
      margin-top: 20px;
      /* 與上方文字的間距 */
    }

    .social-media-links a {
      text-decoration: none;
      /* margin: 0 10px; 原來的 margin 可以用 gap 取代更簡潔 */
    }

    .social-media-links img {
      display: block;
      /* 讓圖片成為區塊元素，更容易控制間距 */
      width: 36px;
      /* 稍微放大社群圖示，讓手機上更容易點擊 */
      height: 36px;
      transition: transform 0.2s ease-in-out;
      /* 懸停效果 */
    }

    .social-media-links img:hover {
      transform: translateY(-3px);
      /* 懸停時稍微上浮 */
    }


    /* --- 響應式呈現 --- */

    /* 小型裝置 (手機和平板直立，最大寬度 768px) */
    @media (max-width: 768px) {
      .contact-section {
        margin: 40px auto;
        /* 縮小上下間距 */
        padding: 0 15px;
        /* 縮小左右內距 */
      }

      .contact-section h2 {
        font-family: "Cactus Classical Serif", serif;
        font-size: 1.8rem;
        /* 縮小專案標題字體 */
      }

      input,
      textarea {
        padding: 10px;
        /* 縮小輸入框內距 */
        font-size: 0.95rem;
        /* 縮小字體 */
      }

      button {
        padding: 10px;
        /* 縮小按鈕內距 */
        font-size: 0.95rem;
        /* 縮小按鈕字體 */
      }

      .social-media-links img {
        width: 32px;
        /* 稍微縮小社群圖示 */
        height: 32px;
      }
    }

    /* 更小的裝置 (例如舊款手機，最大寬度 480px) */
    @media (max-width: 480px) {
      .contact-section h2 {
        font-family: "Cactus Classical Serif", serif;
        font-size: 1.6rem;
      }

      .social-media-links img {
        width: 28px;
        /* 再稍微縮小社群圖示 */
        height: 28px;
      }
    }
  </style>

    <!-- hamburger -->

      <!-- 裡面的三個 <span> 會被 CSS 渲染成三條橫線 -->
      <!-- aria-label 提供了無障礙閱讀的描述。 -->
      <span></span>
      <span></span>
      <span></span>
    </button>

    </nav>

  <section class="contact-section">
    
    <h2>寫信給ChousDesign</h2>
    <hr>
    <form action="https://formspree.io/f/xldnebda" method="POST">
      <label for="name">姓名</label>
      <input type="text" id="name" name="name" placeholder="請輸入您的名字" required />

      <label for="email">電子郵件</label>
      <input type="email" id="email" name="email" placeholder="請輸入您的Email" required />

      <label for="message">訊息內容</label>
      <textarea id="message" name="message" rows="6" placeholder="請輸入您想說的話" required></textarea>

      <button type="submit">送出訊息</button>
    </form>
    <div style="margin-top: 40px; text-align: center">
      <h2>其他聯繫方式</h2>
      <p class="social-media-links">
        <a href="https://www.instagram.com/chous_design/" target="_blank"><img src="./image/contact/instagram.svg"
            alt="instagram icon" width="30px" height="30px" /></a>
        <a href="https://line.me/R/ti/p/@170xuqkb" target="_blank"><img src="./image/contact/Line.svg" alt="line icon"
            width="30px" height="30px" /></a>
      </p>
    </div>
  </section>
