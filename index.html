<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>周周設計誌｜首頁home｜ChousDesign</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC&family=Playfair+Display&display=swap"
    rel="stylesheet" />
  <!-- css連結 -->
  <link rel="stylesheet" href="./css/Normalize.css" />
  <style>
    body {
      margin: 0;
      font-family: "Noto Sans TC", sans-serif;
      background-color: #fdfdfd;
      color: #111;
      line-height: 1.6;
    }

    header {
      padding: 60px 20px;
      text-align: center;
    }

    h1 {
      font-family: "Playfair Display", serif;
      font-size: 2.8rem;
      margin-bottom: 0.3em;
    }

    p.subtitle {
      font-size: 1rem;
      color: #555;
      margin-top: 0;
    }

    .hero-image {
      max-width: 800px;
      width: 100%;
      /* 新增：確保圖片在小螢幕上完整顯示 */
      height: auto;
      /* 新增：保持圖片比例 */
      margin: 40px auto;
      display: block;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
    }

    nav {
      margin-top: 40px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    nav a {
      font-size: 1rem;
      text-decoration: none;
      color: #333;
      border: 1px solid #ddd;
      padding: 10px 20px;
      border-radius: 40px;
      transition: all 0.3s ease;
    }

    nav a:hover {
      background-color: #111;
      color: #fff;
      border-color: #111;
    }

    .footer {
      margin-top: 80px;
      text-align: center;
      font-size: 0.8rem;
      color: #999;
      padding: 40px 20px;
    }

    /* line按鈕 */
    .line-button {
      position: fixed;
      /* 讓按鈕固定在視窗中 */
      bottom: 20px;
      /* 距離底部 20 像素，可依需求調整 */
      right: 20px;
      /* 距離右側 20 像素，可依需求調整 */
      background-color: #00B900;
      /* Line 的品牌綠色 */
      border-radius: 50%;
      /* 使按鈕呈現圓形 */
      padding: 10px;
      /* 內邊距 */
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      /* 陰影效果 */
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      /* 確保按鈕在其他內容之上 */
      transition: transform 0.3s ease;
      /* 滑鼠懸停時的動畫效果 */
    }

    .line-button:hover {
      transform: scale(1.1);
      /* 滑鼠懸停時放大 10% */
    }

    .line-button img {
      width: 40px;
      /* 圖示寬度，可依需求調整 */
      height: 40px;
      /* 圖示高度，可依需求調整 */
      display: block;
    }

    /* 響應式呈現 */

    @media (max-width: 768px) {
      h1 {
        font-size: 2rem;
        /* 縮小標題字體 */
      }

      p.subtitle {
        font-size: 0.9rem;
        /* 縮小副標題字體 */
      }

      nav {
        flex-direction: column;
        /* 導覽列項目垂直排列 */
        align-items: center;
        /* 導覽列項目置中 */
        gap: 10px;
        /* 縮小導覽列項目間距 */
      }

      nav a {
        width: 80%;
        /* 讓導覽列連結佔據更多寬度 */
        max-width: 300px;
        /* 避免在小螢幕上過寬 */
        text-align: center;
        /* 文字置中 */
        padding: 12px 0;
        /* 調整內距 */
      }

      header {
        padding: 30px 15px;
        /* 縮小標頭內距 */
      }

      .hero-image {
        margin: 20px auto;
        /* 縮小圖片上下間距 */
      }

      .line-button {
        bottom: 15px;
        right: 15px;
        padding: 8px;
      }

      .line-button img {
        width: 35px;
        height: 35px;
      }
    }

    /* 更小的裝置 (例如舊款手機，最大寬度 480px) */
    @media (max-width: 480px) {
      h1 {
        font-size: 1.6rem;
      }

      p.subtitle {
        font-size: 0.8rem;
      }

      .line-button {
        bottom: 10px;
        right: 10px;
        padding: 6px;
      }

      .line-button img {
        width: 30px;
        height: 30px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>周周設計誌｜ChousDesign</h1>
    <p class="subtitle">品牌視覺設計 × 平面設計 × UI/UX、網頁設計 × 基礎攝影</p>
    <img class="hero-image" src="./image/index/banner.png" alt="ZhouZhou Hero Image" />
    <nav>
      <a href="./index.html">首頁</a>
      <a href="./works.html">作品集總覽</a>
      <a href="./about.html">關於我</a>
      <a href="./blog.html">部落格</a>
      <a href="./contact.html">聯絡我</a>
    </nav>
  </header>

  <!-- line按鈕 -->
  <a href="https://line.me/R/ti/p/@170xuqkb" class="line-button" target="_blank" aria-label="加我Line">
    <img src="./image/contact/Line(green).svg" alt="Line 圖示" />
  </a>

  <!-- 頁尾 -->


  <div class="footer">&copy; 2025 ChousDesign . All Rights Reserved.</div>
</body>

</html>
